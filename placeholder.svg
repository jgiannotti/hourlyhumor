<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <pattern id="stars" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <text x="20" y="28" text-anchor="middle" font-size="20" fill="white" opacity="0.6">★</text>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#stars)"/>
  <rect x="40" y="120" width="520" height="160" fill="black" stroke="white" stroke-width="4"/>
  <text x="300" y="180" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="32" font-weight="bold" fill="yellow">LOADING THE FUNNY...</text>
  <text x="300" y="230" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="18" fill="cyan">First meme drops at the top of the hour</text>
  <text x="300" y="260" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="white">(refresh in a bit!)</text>
